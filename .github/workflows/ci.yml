name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.out.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            run_e2e:
              - 'rfr-auth/**'
              - 'rfr-api/**'
              - 'rfr-e2e/**'
              - 'rfr-gql-client/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/ci.yml'

      - name: Resolve run_e2e output
        id: out
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_e2e=true
          else
            run_e2e="${{ steps.filter.outputs.run_e2e }}"
          fi
          echo "run_e2e=${run_e2e}" >> "$GITHUB_OUTPUT"
          echo "run_e2e=${run_e2e}"

  e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json

      - name: Start backends (runAll --parallel, background)
        run: |
          set -euo pipefail
          mkdir -p build/ci-e2e/gradle-home build/ci-e2e/project-cache
          GRADLE_USER_HOME="$PWD/build/ci-e2e/gradle-home" \
            nohup ./gradlew runAll --parallel --no-daemon \
            --project-cache-dir="$PWD/build/ci-e2e/project-cache" \
            > runAll.log 2>&1 &
          echo $! > runAll.pid

      - name: Install frontend deps and start npm run dev (background)
        working-directory: rfr-gql-client
        run: |
          set -euo pipefail
          npm ci
          # Bind IPv4 so wait-on tcp:127.0.0.1:3001 works on the runner
          VITE_FRONT_HOST=127.0.0.1 nohup npm run dev > ../front.log 2>&1 &
          echo $! > ../front.pid

      - name: Wait for ports 9001, 8081, 3001
        run: |
          set -euo pipefail
          wait_port() {
            local host=$1 port=$2 timeout_sec=$3
            echo "Waiting for ${host}:${port} (timeout ${timeout_sec}s)..."
            # Fail on timeout; poll until TCP accepts (no fixed sleep-before-tests)
            timeout "${timeout_sec}" bash -c "
              while ! (echo >/dev/tcp/${host}/${port}) >/dev/null 2>&1; do
                sleep 0.5
              done
            "
            echo "Port ${port} is open"
          }
          wait_port 127.0.0.1 9001 180
          wait_port 127.0.0.1 8081 180
          wait_port 127.0.0.1 3001 180

      - name: Install Playwright Chromium (with OS deps)
        run: ./gradlew :rfr-e2e:installPlaywrightWithDeps --no-daemon

      - name: Run e2e tests
        run: ./gradlew runE2e --no-daemon

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            runAll.log
            front.log
            rfr-e2e/build/reports/tests/test/**
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: rfr-e2e/build/allure-results
          if-no-files-found: ignore
