name: PR CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build backends and compile e2e
        run: ./gradlew :rfr-auth:assemble :rfr-api:assemble :rfr-e2e:testClasses --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json

      - name: Lint and build frontend
        working-directory: rfr-gql-client
        run: |
          npm ci
          npm run lint
          npm run build
