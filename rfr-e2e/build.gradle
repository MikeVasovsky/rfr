plugins {
    id 'io.qameta.allure' version '4.3.0'
}

group = 'io.student'
version = '1.0.0'

def allureJavaVersion = '3.0.0'
def allureReportVersion = '3.17.0'
def aspectJVersion = '1.9.25.1'
def junitVersion = '6.1.3'
def playwrightVersion = '1.63.0'

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation platform("io.qameta.allure:allure-bom:$allureJavaVersion")

    testImplementation "io.qameta.allure:allure-jupiter"
    testImplementation "io.qameta.allure:allure-playwright"
    testImplementation "com.microsoft.playwright:playwright:$playwrightVersion"
    testImplementation "net.datafaker:datafaker:2.4.4"
    testImplementation "mysql:mysql-connector-java:8.0.33"
    testImplementation "org.springframework:spring-jdbc:6.2.11"
    testImplementation "org.springframework.security:spring-security-crypto:6.5.5"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-suite"
    testImplementation "org.junit.platform:junit-platform-testkit"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.aspectj:aspectjrt:$aspectJVersion"
}


allure {
    version = allureReportVersion
    adapter {
        autoconfigure.set(false)
    }
}

def configureE2eSuite = { Test task ->
    task.outputs.upToDateWhen { false }
    // EngineTestKit fixtures (*Case / *Cases) and @ProbeTarget must not run as suite tests.
    task.filter {
        excludeTestsMatching '*Case'
        excludeTestsMatching '*Cases'
    }
    task.useJUnitPlatform {
        def exclude = ['probe'] as Set
        def excludeProp = System.getProperty('excludeTags')
        if (excludeProp) {
            exclude.addAll(excludeProp.split(',')*.trim().findAll { it })
        }
        excludeTags(exclude as String[])
        def include = System.getProperty('includeTags')
        if (include) {
            includeTags(*(include.split(',')*.trim().findAll { it }))
        }
    }
    task.jvmArgumentProviders.add({ ["-javaagent:${configurations.agent.singleFile}"] } as CommandLineArgumentProvider)
    task.systemProperty 'rfr.frontUrl', System.getProperty('rfr.frontUrl', 'http://localhost:3001')
    task.systemProperty 'rfr.authUrl', System.getProperty('rfr.authUrl', 'http://localhost:9001')
}

tasks.named('test', Test).configure {
    configureE2eSuite(it)
    // @Suite-класс не должен подхватываться Jupiter в обычном test (иначе дубли с suite-engine).
    filter {
        excludeTestsMatching '*Suite'
    }
}

tasks.register('e2e', Test) {
    group = 'verification'
    description = 'Run e2e through RangifflerE2eSuite (junit-platform-suite)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}
tasks.named('e2e', Test).configure {
    configureE2eSuite(it)
    filter {
        includeTestsMatching '*RangifflerE2eSuite'
    }
    useJUnitPlatform {
        includeEngines 'junit-platform-suite'
        def exclude = ['probe'] as Set
        def excludeProp = System.getProperty('excludeTags')
        if (excludeProp) {
            exclude.addAll(excludeProp.split(',')*.trim().findAll { it })
        }
        excludeTags(exclude as String[])
        def include = System.getProperty('includeTags')
        if (include) {
            includeTags(*(include.split(',')*.trim().findAll { it }))
        }
    }
}

tasks.register('installPlaywright', JavaExec) {
    group = 'e2e'
    description = 'Install Chromium browser for Playwright'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('installPlaywrightWithDeps', JavaExec) {
    group = 'e2e'
    description = 'Install Chromium with OS dependencies'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', '--with-deps', 'chromium'
}
